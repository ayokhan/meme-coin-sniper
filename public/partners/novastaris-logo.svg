<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" role="img" aria-label="NovaStaris">
  <defs>
    <linearGradient id="ns-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ns-glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="ns-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Icon badge -->
  <circle cx="20" cy="20" r="17" fill="#0a1018" stroke="url(#ns-core)" stroke-width="1.2"/>
  <circle cx="20" cy="20" r="12.5" fill="none" stroke="url(#ns-core)" stroke-width="0.6" opacity="0.45"/>
  <!-- Star / bolt mark -->
  <path
    d="M20 9.5 L23.2 17.2 L31.5 18.2 L25.2 23.5 L27 31.5 L20 27.2 L13 31.5 L14.8 23.5 L8.5 18.2 L16.8 17.2 Z"
    fill="url(#ns-core)"
    filter="url(#ns-soft)"
  />
  <path d="M20 13.5 L21.8 18.2 L26.5 18.8 L22.8 21.8 L24 26.5 L20 24 L16 26.5 L17.2 21.8 L13.5 18.8 L18.2 18.2 Z" fill="#ecfeff" opacity="0.92"/>
  <!-- Wordmark -->
  <text x="44" y="25.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" letter-spacing="-0.02em">
    <tspan fill="url(#ns-glow)">Nova</tspan><tspan fill="#f4f4f5">Staris</tspan>
  </text>
  <text x="44" y="33" font-family="Segoe UI, system-ui, sans-serif" font-size="5.5" font-weight="600" fill="#71717a" letter-spacing="0.28em">AI TRADING</text>
</svg>
